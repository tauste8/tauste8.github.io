# AUTORECA IA — despliegue en Render (https://render.com) con un "Blueprint".
# Render crea la base de datos PostgreSQL y la aplicación a partir de este archivo.
# Los planes se pueden cambiar después desde el panel de Render.
services:
  - type: web
    name: autoreca-ia
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: autoreca-db
          property: connectionString
      - key: APP_ENCRYPTION_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false

databases:
  - name: autoreca-db
    databaseName: autoreca
    user: autoreca
    plan: basic-256mb
