services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:22-bookworm
    command: sleep infinity
    volumes:
      - ../..:/workspaces:cached
    environment:
      DATABASE_URL: postgres://autoreca:autoreca@db:5432/autoreca
      PORT: "3000"
      WEB_DIST: ../web/dist
    depends_on:
      - db

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: autoreca
      POSTGRES_USER: autoreca
      POSTGRES_PASSWORD: autoreca
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
